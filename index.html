<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg-fallback"></div>
<video id="background" muted loop playsinline></video>

<div id="start-screen">
  <div id="start-text"></div>
</div>

<!-- Hamburger menu (top-left): Profile / Skills / Projects -->
<button id="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
<nav id="menu-nav" class="hidden">
  <button data-tab="profile" class="active">Profile</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="projects">Projects</button>
</nav>

<div id="profile-block" class="hidden">
  <div class="profile-container">
    <!-- TAB: PROFILE -->
    <section id="tab-profile" class="tab active">
      <div class="avatar-wrap">
        <img id="profile-picture" class="profile-picture" alt="avatar">
        <!-- Decoration overlay injected by script.js (Discord sync) -->
      </div>
      <h1 id="profile-name" class="profile-name"></h1>
      <p id="profile-username" class="profile-username"></p>
      <p id="profile-bio" class="profile-bio"></p>
      <div id="presence-row" class="presence-row hidden">
        <span id="presence-dot" class="presence-dot offline"></span>
        <span id="presence-text">Offline</span>
      </div>
      <p id="profile-location" class="profile-location"></p>
      <div id="spotify-now" class="spotify-now hidden">
        <img id="spotify-art" alt="">
        <div><div id="spotify-song"></div><div id="spotify-artist"></div></div>
      </div>
      <div id="badge-group" class="badge-group"></div>
      <div id="social-links" class="social-links"></div>
      <!-- Spotify-style music player (same track as background music) -->
      <div id="player" class="player hidden">
        <button id="player-toggle" aria-label="Play / pause">▶</button>
        <div class="player-main">
          <div id="player-title">No music</div>
          <div class="player-row">
            <span id="player-cur">0:00</span>
            <input id="player-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
            <span id="player-dur">0:00</span>
          </div>
        </div>
      </div>
      <div id="audio-error" class="audio-error hidden"></div>
      <div class="profile-foot">
        <div class="visitor-counter">
          <span id="visitor-count">0</span>
          <span class="visitor-label">views</span>
        </div>
        <button id="share-btn" class="share-btn">Share profile</button>
      </div>
      <div id="toast" class="toast hidden">Copied!</div>
      <div id="share-modal" class="qr-modal hidden">
        <div class="qr-box">
          <img id="qr-img" alt="Profile QR code">
          <div class="qr-row">
            <button id="qr-copy" class="share-btn">Copy link</button>
            <button id="qr-close" class="share-btn">Close</button>
          </div>
        </div>
      </div>
    </section>
    <!-- TAB: SKILLS -->
    <section id="tab-skills" class="tab">
      <h2 class="tab-title">Skills</h2>
      <div class="orbit-wrap">
        <div id="orbit" class="orbit"></div>
        <div class="orbit-center">CODE</div>
      </div>
      <div id="skills-list" class="skills-list"></div>
    </section>
    <!-- TAB: PROJECTS -->
    <section id="tab-projects" class="tab">
      <h2 class="tab-title">Projects</h2>
      <div id="projects-list" class="projects-list"></div>
    </section>
  </div>
</div>

<div id="music-hint">Tap for music</div>
<button id="music-toggle" aria-label="Toggle music">
  <span class="eq"><i></i><i></i><i></i><i></i></span>
  <svg class="ic-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>
    <line x1="22" y1="9" x2="16" y2="15"></line>
    <line x1="16" y1="9" x2="22" y2="15"></line>
  </svg>
</button>

<audio id="background-music" loop preload="auto"></audio>

<script>
  fetch('/api/profile')
    .then((r) => r.json())
    .then((j) => { window.PF_CONFIG = (j && j.ok && j.config) || {}; })
    .catch(() => { window.PF_CONFIG = {}; });
</script>
<script src="script.js"></script>
</body>
</html>
