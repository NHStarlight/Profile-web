<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>staff apply</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---- Staff Apply Page ---- */
    .staff-apply {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
    }
    .staff-apply h1 {
      text-align: center;
      color: var(--accent);
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 3px;
    }
    .staff-apply p {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }
    .btn-submit {
      width: 100%;
      padding: 0.9rem 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background: #e6e6e6;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .success-msg {
      text-align: center;
      margin-top: 2rem;
      color: var(--accent);
      display: none;
    }
    .success-msg.visible {
      display: block;
    }
    /* Optional: subtle orbit background */
    .orbit-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .orbit-ring {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: orbitSpin 20s linear infinite;
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Optional subtle orbit background -->
  <div class="orbit-wrapper">
    <div class="orbit-ring" style="width: 300px; height: 300px; top: 50%; left: 50%; margin: -150px 0 0 -150px; animation-duration: 25s;"></div>
    <div class="orbit-ring" style="width: 150px; height: 150px; top: 20%; left: 80%; margin: -75px 0 0 -75px; animation-duration: 18s;"></div>
  </div>

  <div class="staff-apply">
    <h1>staff apply</h1>
    <p>Vui lòng điền thông tin dưới đây để chúng tôi xem xét ứng viên của bạn.</p>

    <form id="staffForm">
      <div class="form-group">
        <label for="fullName">Họ và Tên</label>
        <input type="text" id="fullName" name="fullName" required placeholder="Ví dụ: Nguyễn Văn A">
      </div>

      <div class="form-group">
        <label for="discordTag">Tag Discord</label>
        <input type="text" id="discordTag" name="discordTag" placeholder="Ví dụ: Hana#0001">
      </div>

      <div class="form-group">
        <label for="why">Tại sao muốn nhập staff?</label>
        <textarea id="why" name="why" required placeholder="Nhập lý do bạn thích muốn gia nhập staff team..."></textarea>
      </div>

      <div class="form-group">
        <label for="skills">Kiến thức hoặc kỹ năng bạn có (nếu có)</label>
        <textarea id="skills" name="skills" placeholder="Ví dụ: Làm quản lý, tạo bot, thiết kế, v.v..."></textarea>
      </div>

      <div class="form-group">
        <label for="portfolio">Portfolio/Link (nếu có)</label>
        <input type="url" id="portfolio" name="portfolio" placeholder="https://...">
      </div>

      <button type="submit" class="btn-submit">Gửi đơn ứng viên</button>
    </form>

    <div class="success-msg" id="success">Cảm ơn! Chúng tôi sẽ xem xét ứng của bạn và gửi kết quả về email.</div>
  </div>

  <script>
    const form = document.getElementById('staffForm');
    const successMsg = document.getElementById('success');
    
    // Đảm bảo tất cả input fields focusable và có thể gõ
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = form.querySelectorAll('input, textarea');
      inputs.forEach(input => {
        input.removeAttribute('disabled');
        input.addEventListener('focus', () => {
          input.style.borderColor = '#a0dff5';
        });
        input.addEventListener('blur', () => {
          input.style.borderColor = 'rgba(255,255,255,0.2)';
        });
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Collect form data
      const formData = new FormData(form);
      const object = Object.fromEntries(formData);
      
      // Clear previous messages
      successMsg.style.display = 'none';
      successMsg.innerHTML = '';
      
      try {
        // Send to our own API for logging + scoring
        const response = await fetch('/api/staff-apply', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(object),
        });
        
        // Try to parse JSON response, handle gracefully
        let result;
        try {
          result = await response.json();
        } catch {
          result = { ok: false, error: 'Phản hồi từ server không đúng định dạng' };
        }
        
        if (result.ok) {
          // Success case
          successMsg.innerHTML = `
            <div style="background: rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 8; margin-top: 1rem;">
              <h3>✓ Đơn ứng viên đã được lưu!</h3>
              <p>Điểm chấm nhận định: <strong>${result.score || 0}/5</strong> (${result.reasons ? result.reasons.length : 0}/5 lý do)</p>
              <p>Lý do: ${result.reasons ? result.reasons.map(r => '• ' + r).join('<br>') : 'Đang xử lý'}</p>
              <p>Chúng tôi sẽ xem xét và liên hệ qua email: justhanaa@proton.me</p>
            </div>
          `;
          successMsg.style.display = 'block';
          form.reset();
        } else {
          // API returned error but OK flag is false
          alert('Có lỗi xảy ra khi lưu đơn: ' + (result.error || 'Vui lòng thử lại sau'));
        }
      } catch (error) {
        // Network error or other fetch error
        console.error('Lỗi fetch:', error);
        // Even if API fails, still allow form submission visually
        alert('Không thể kết nối đến máy chủ. Tuy nhiên, bạn vẫn có thể gõ nội dung. Vui lòng thử lại sau hoặc liên hệ admin trực tiếp.');
        // Don't reset the form so user can copy their input
      }
    });
  </script>

</body>
</html>
